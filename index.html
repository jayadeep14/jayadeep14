<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Jayadeep T P — Terminal Profile</title>

<script
    async
    src="https://docs.opencv.org/4.x/opencv.js"
    onload="onOpenCVReady()">
</script>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: #020603;

#svgContainer svg {

    }

    }

    }

</head>

<body>

<div id="svgContainer">
    <div class="initial-message">
        <span>
            &gt; loading profile...
        </span>
    </div>
</div>

<canvas
    id="processingCanvas"
    style="display:none;">
</canvas>

<script>

"use strict";

/* ============================================================
   PROFILE CONFIGURATION

   CHANGE YOUR PROFILE HERE.
   You do NOT need to edit the SVG below.
============================================================ */

const PROFILE = {

    name: "Jayadeep T P",

    profession:
        "Linux | Python Vibe Coder | AI Builder",

    skills: [
        "Java AI",
        "Robotics",
        "PyQt6 / C++",
        "LLM",
        "AI Products"
    ],

    description:
        "| visual. + secure APIs, SaaS products, custom tooling",

    footer:
        "> terminal profile",

    image:
        "Pasted-image.png"
};


/* ============================================================
   GLOBALS
============================================================ */

let openCVReady = false;
let selectedImage = null;
let generatedSVG = "";
let generationStarted = false;


/* ============================================================
   DOM
============================================================ */

const svgContainer =
    document.getElementById("svgContainer");

const processingCanvas =
    document.getElementById("processingCanvas");


/* ============================================================
   OPENCV READY
============================================================ */

function onOpenCVReady() {

    if (
        typeof cv !== "undefined" &&
        cv &&
        typeof cv.Mat === "function"
    ) {

        openCVReady = true;

        startAutomaticGeneration();

    } else {

        setTimeout(
            onOpenCVReady,
            100
        );
    }
}


/* ============================================================
   LOAD IMAGE IMMEDIATELY
============================================================ */

function loadLocalPortrait() {

    const image = new Image();

    image.onload = function () {

        selectedImage = image;

        startAutomaticGeneration();
    };

    image.onerror = function () {

        svgContainer.innerHTML = `
            <div
                class="initial-message"
                style="color:#ff6b6b;">

                <span>
                    &gt; ERROR: ${escapeXML(PROFILE.image)} not found
                </span>

            </div>
        `;
    };

    /*
        Pasted-image.png must be in the
        SAME folder as this HTML file.
    */

    image.src = PROFILE.image;
}


/* ============================================================
   START AUTOMATIC GENERATION
============================================================ */

async function startAutomaticGeneration() {

    if (
        generationStarted ||
        !openCVReady ||
        !selectedImage
    ) {
        return;
    }

    generationStarted = true;

    try {

        const mask =
            buildSubjectMask(
                selectedImage
            );

        generatedSVG =
            generateSVG(
                selectedImage,
                mask
            );

        mask.delete();

        /*
            SHOW THE GENERATED PROFILE
            IMMEDIATELY.
        */

        svgContainer.innerHTML =
            generatedSVG;

    } catch (error) {

        console.error(error);

        svgContainer.innerHTML = `
            <div
                class="initial-message"
                style="color:#ff6b6b;">

                <span>
                    &gt; ERROR:
                    ${escapeXML(
                        error.message ||
                        "Unknown error"
                    )}
                </span>

            </div>
        `;
    }
}


/* ============================================================
   LARGEST COMPONENT
============================================================ */

function largestComponent(binary) {

    const labels = new cv.Mat();
    const stats = new cv.Mat();
    const centroids = new cv.Mat();

    const count =
        cv.connectedComponentsWithStats(
            binary,
            labels,
            stats,
            centroids,
            8,
            cv.CV_32S
        );

    if (count <= 1) {

        labels.delete();
        stats.delete();
        centroids.delete();

        return binary.clone();
    }

    let largest = 1;
    let largestArea = 0;

    for (
        let i = 1;
        i < count;
        i++
    ) {

        const area =
            stats.intAt(
                i,
                cv.CC_STAT_AREA
            );

        if (area > largestArea) {

            largestArea = area;
            largest = i;
        }
    }

    const result =
        cv.Mat.zeros(
            binary.rows,
            binary.cols,
            cv.CV_8UC1
        );

    for (
        let y = 0;
        y < labels.rows;
        y++
    ) {

        for (
            let x = 0;
            x < labels.cols;
            x++
        ) {

            if (
                labels.intAt(y, x) ===
                largest
            ) {

                result.ucharPtr(y, x)[0] =
                    255;
            }
        }
    }

    labels.delete();
    stats.delete();
    centroids.delete();

    return result;
}


/* ============================================================
   BUILD SUBJECT MASK
============================================================ */

function buildSubjectMask(image) {

    const maxWidth = 520;

    const sourceWidth =
        image.naturalWidth ||
        image.width;

    const sourceHeight =
        image.naturalHeight ||
        image.height;

    const segWidth =
        Math.min(
            maxWidth,
            sourceWidth
        );

    const segHeight =
        Math.max(
            1,
            Math.round(
                sourceHeight *
                segWidth /
                sourceWidth
            )
        );

    processingCanvas.width =
        segWidth;

    processingCanvas.height =
        segHeight;

    const ctx =
        processingCanvas.getContext(
            "2d",
            {
                willReadFrequently: true
            }
        );

    ctx.clearRect(
        0,
        0,
        segWidth,
        segHeight
    );

    ctx.drawImage(
        image,
        0,
        0,
        segWidth,
        segHeight
    );


    /* --------------------------------------------------------
       IMAGE TO OPENCV
    -------------------------------------------------------- */

    const src =
        cv.imread(
            processingCanvas
        );

    const bgr =
        new cv.Mat();

    cv.cvtColor(
        src,
        bgr,
        cv.COLOR_RGBA2RGB
    );


    /* --------------------------------------------------------
       INITIAL GRABCUT MASK
    -------------------------------------------------------- */

    const mask =
        new cv.Mat(
            segHeight,
            segWidth,
            cv.CV_8UC1,
            new cv.Scalar(
                cv.GC_PR_BGD
            )
        );

    const border =
        Math.max(
            5,
            Math.floor(
                segWidth * 0.018
            )
        );


    /* --------------------------------------------------------
       BACKGROUND BORDER
    -------------------------------------------------------- */

    mask.rowRange(
        0,
        border
    ).setTo(
        new cv.Scalar(
            cv.GC_BGD
        )
    );

    mask.rowRange(
        segHeight - border,
        segHeight
    ).setTo(
        new cv.Scalar(
            cv.GC_BGD
        )
    );

    mask.colRange(
        0,
        border
    ).setTo(
        new cv.Scalar(
            cv.GC_BGD
        )
    );

    mask.colRange(
        segWidth - border,
        segWidth
    ).setTo(
        new cv.Scalar(
            cv.GC_BGD
        )
    );


    const cx =
        Math.floor(
            segWidth / 2
        );


    /* --------------------------------------------------------
       HEAD REGION
    -------------------------------------------------------- */

    cv.ellipse(
        mask,
        new cv.Point(
            cx,
            Math.floor(
                segHeight * 0.42
            )
        ),
        new cv.Size(
            Math.max(
                1,
                Math.floor(
                    segWidth * 0.23
                )
            ),
            Math.max(
                1,
                Math.floor(
                    segHeight * 0.22
                )
            )
        ),
        0,
        0,
        360,
        new cv.Scalar(
            cv.GC_PR_FGD
        ),
        -1
    );


    /* --------------------------------------------------------
       TORSO
    -------------------------------------------------------- */

    const torso =
        cv.matFromArray(
            4,
            1,
            cv.CV_32SC2,
            [

                Math.floor(
                    segWidth * 0.08
                ),
                Math.floor(
                    segHeight * 0.64
                ),

                Math.floor(
                    segWidth * 0.92
                ),
                Math.floor(
                    segHeight * 0.64
                ),

                Math.floor(
                    segWidth * 0.98
                ),
                Math.floor(
                    segHeight * 0.98
                ),

                Math.floor(
                    segWidth * 0.02
                ),
                Math.floor(
                    segHeight * 0.98
                )
            ]
        );

    cv.fillConvexPoly(
        mask,
        torso,
        new cv.Scalar(
            cv.GC_PR_FGD
        )
    );


    /* --------------------------------------------------------
       CERTAIN FACE
    -------------------------------------------------------- */

    cv.ellipse(
        mask,
        new cv.Point(
            cx,
            Math.floor(
                segHeight * 0.43
            )
        ),
        new cv.Size(
            Math.max(
                1,
                Math.floor(
                    segWidth * 0.07
                )
            ),
            Math.max(
                1,
                Math.floor(
                    segHeight * 0.14
                )
            )
        ),
        0,
        0,
        360,
        new cv.Scalar(
            cv.GC_FGD
        ),
        -1
    );


    /* --------------------------------------------------------
       GRABCUT
    -------------------------------------------------------- */

    const bgModel =
        new cv.Mat();

    const fgModel =
        new cv.Mat();

    try {

        cv.grabCut(
            bgr,
            mask,
            new cv.Rect(
                0,
                0,
                0,
                0
            ),
            bgModel,
            fgModel,
            7,
            cv.GC_INIT_WITH_MASK
        );

    } catch (error) {

        console.error(
            "GrabCut failed:",
            error
        );

        const fallback =
            cv.Mat.zeros(
                segHeight,
                segWidth,
                cv.CV_8UC1
            );

        cv.ellipse(
            fallback,
            new cv.Point(
                cx,
                Math.floor(
                    segHeight * 0.42
                )
            ),
            new cv.Size(
                Math.floor(
                    segWidth * 0.25
                ),
                Math.floor(
                    segHeight * 0.25
                )
            ),
            0,
            0,
            360,
            new cv.Scalar(255),
            -1
        );

        cv.fillConvexPoly(
            fallback,
            torso,
            new cv.Scalar(255)
        );

        const resized =
            new cv.Mat();

        cv.resize(
            fallback,
            resized,
            new cv.Size(
                sourceWidth,
                sourceHeight
            ),
            0,
            0,
            cv.INTER_LANCZOS4
        );

        src.delete();
        bgr.delete();
        mask.delete();
        torso.delete();
        bgModel.delete();
        fgModel.delete();
        fallback.delete();

        return resized;
    }


    /* --------------------------------------------------------
       FOREGROUND
    -------------------------------------------------------- */

    const foreground =
        cv.Mat.zeros(
            segHeight,
            segWidth,
            cv.CV_8UC1
        );

    for (
        let y = 0;
        y < segHeight;
        y++
    ) {

        for (
            let x = 0;
            x < segWidth;
            x++
        ) {

            const value =
                mask.ucharPtr(y, x)[0];

            if (
                value === cv.GC_FGD ||
                value === cv.GC_PR_FGD
            ) {

                foreground.ucharPtr(
                    y,
                    x
                )[0] = 255;
            }
        }
    }


    /* --------------------------------------------------------
       LARGEST COMPONENT
    -------------------------------------------------------- */

    const largest =
        largestComponent(
            foreground
        );


    /* --------------------------------------------------------
       MORPHOLOGICAL CLEANUP
    -------------------------------------------------------- */

    const closeKernel =
        cv.Mat.ones(
            7,
            7,
            cv.CV_8U
        );

    const openKernel =
        cv.Mat.ones(
            3,
            3,
            cv.CV_8U
        );

    const closed =
        new cv.Mat();

    cv.morphologyEx(
        largest,
        closed,
        cv.MORPH_CLOSE,
        closeKernel,
        new cv.Point(-1, -1),
        2
    );

    const opened =
        new cv.Mat();

    cv.morphologyEx(
        closed,
        opened,
        cv.MORPH_OPEN,
        openKernel,
        new cv.Point(-1, -1),
        1
    );


    /* --------------------------------------------------------
       SOFT EDGES
    -------------------------------------------------------- */

    const blurred =
        new cv.Mat();

    cv.GaussianBlur(
        opened,
        blurred,
        new cv.Size(
            5,
            5
        ),
        0,
        0,
        cv.BORDER_DEFAULT
    );


    /* --------------------------------------------------------
       ORIGINAL SIZE
    -------------------------------------------------------- */

    const finalMask =
        new cv.Mat();

    cv.resize(
        blurred,
        finalMask,
        new cv.Size(
            sourceWidth,
            sourceHeight
        ),
        0,
        0,
        cv.INTER_LANCZOS4
    );


    /* --------------------------------------------------------
       CLEANUP
    -------------------------------------------------------- */

    src.delete();
    bgr.delete();
    mask.delete();
    torso.delete();

    bgModel.delete();
    fgModel.delete();

    foreground.delete();
    largest.delete();

    closeKernel.delete();
    openKernel.delete();

    closed.delete();
    opened.delete();
    blurred.delete();

    return finalMask;
}


/* ============================================================
   COVER CROP
============================================================ */

function coverCropBox(
    width,
    height,
    ratio
) {

    const sourceRatio =
        width / height;

    if (
        sourceRatio > ratio
    ) {

        const cropWidth =
            Math.floor(
                height * ratio
            );

        const left =
            Math.floor(
                (width - cropWidth) / 2
            );

        return {
            x: left,
            y: 0,
            width: cropWidth,
            height: height
        };
    }

    const cropHeight =
        Math.floor(
            width / ratio
        );

    const top =
        Math.floor(
            (height - cropHeight) / 2
        );

    return {
        x: 0,
        y: top,
        width: width,
        height: cropHeight
    };
}


/* ============================================================
   ESCAPE XML
============================================================ */

function escapeXML(value) {

    return String(value)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&apos;"
        );
}


/* ============================================================
   GENERATE PARTICLES
============================================================ */

function generateParticles(
    image,
    mask
) {

    const DURATION = 10.0;

    const P_W = 460;
    const P_H = 480;

    const P_X = 850;
    const P_Y = 60;

    const SPACING = 4;

    const cols =
        Math.floor(
            P_W / SPACING
        );

    const rows =
        Math.floor(
            P_H / SPACING
        );


    /* --------------------------------------------------------
       SOURCE CANVAS
    -------------------------------------------------------- */

    const sourceCanvas =
        document.createElement(
            "canvas"
        );

    sourceCanvas.width =
        image.naturalWidth ||
        image.width;

    sourceCanvas.height =
        image.naturalHeight ||
        image.height;

    const sourceContext =
        sourceCanvas.getContext(
            "2d",
            {
                willReadFrequently: true
            }
        );

    sourceContext.drawImage(
        image,
        0,
        0
    );


    /* --------------------------------------------------------
       CROP
    -------------------------------------------------------- */

    const crop =
        coverCropBox(
            sourceCanvas.width,
            sourceCanvas.height,
            P_W / P_H
        );


    /* --------------------------------------------------------
       GRAYSCALE IMAGE
    -------------------------------------------------------- */

    const grayCanvas =
        document.createElement(
            "canvas"
        );

    grayCanvas.width =
        cols;

    grayCanvas.height =
        rows;

    const grayContext =
        grayCanvas.getContext(
            "2d",
            {
                willReadFrequently: true
            }
        );

    grayContext.filter =
        "grayscale(1) contrast(135%)";

    grayContext.drawImage(
        sourceCanvas,

        crop.x,
        crop.y,
        crop.width,
        crop.height,

        0,
        0,
        cols,
        rows
    );

    const grayData =
        grayContext.getImageData(
            0,
            0,
            cols,
            rows
        ).data;


    /* --------------------------------------------------------
       MASK CANVAS
    -------------------------------------------------------- */

    const maskCanvas =
        document.createElement(
            "canvas"
        );

    maskCanvas.width =
        sourceCanvas.width;

    maskCanvas.height =
        sourceCanvas.height;

    const maskContext =
        maskCanvas.getContext(
            "2d",
            {
                willReadFrequently: true
            }
        );

    const maskData =
        new Uint8ClampedArray(
            mask.rows *
            mask.cols *
            4
        );

    for (
        let y = 0;
        y < mask.rows;
        y++
    ) {

        for (
            let x = 0;
            x < mask.cols;
            x++
        ) {

            const value =
                mask.ucharPtr(y, x)[0];

            const index =
                (
                    y * mask.cols +
                    x
                ) * 4;

            maskData[index] =
                value;

            maskData[index + 1] =
                value;

            maskData[index + 2] =
                value;

            maskData[index + 3] =
                255;
        }
    }

    const maskImageData =
        new ImageData(
            maskData,
            mask.cols,
            mask.rows
        );

    maskContext.putImageData(
        maskImageData,
        0,
        0
    );


    /* --------------------------------------------------------
       SMALL MASK
    -------------------------------------------------------- */

    const smallMaskCanvas =
        document.createElement(
            "canvas"
        );

    smallMaskCanvas.width =
        cols;

    smallMaskCanvas.height =
        rows;

    const smallMaskContext =
        smallMaskCanvas.getContext(
            "2d",
            {
                willReadFrequently: true
            }
        );

    smallMaskContext.drawImage(
        maskCanvas,

        crop.x,
        crop.y,
        crop.width,
        crop.height,

        0,
        0,
        cols,
        rows
    );

    const smallMaskData =
        smallMaskContext.getImageData(
            0,
            0,
            cols,
            rows
        ).data;


    /* --------------------------------------------------------
       PARTICLES
    -------------------------------------------------------- */

    const circles = [];

    const total =
        Math.max(
            1,
            rows * cols - 1
        );

    for (
        let y = 0;
        y < rows;
        y++
    ) {

        for (
            let x = 0;
            x < cols;
            x++
        ) {

            const pixelIndex =
                (
                    y * cols +
                    x
                ) * 4;

            const maskValue =
                smallMaskData[
                    pixelIndex
                ];

            if (
                maskValue < 125
            ) {
                continue;
            }

            const r =
                grayData[
                    pixelIndex
                ];

            const g =
                grayData[
                    pixelIndex + 1
                ];

            const b =
                grayData[
                    pixelIndex + 2
                ];

            const lum =
                (
                    0.299 * r +
                    0.587 * g +
                    0.114 * b
                ) / 255;

            const radius =
                0.40 +
                Math.pow(
                    lum,
                    0.90
                ) * 1.15;

            const opacity =
                0.42 +
                lum * 0.58;

            const cx =
                P_X +
                x * SPACING +
                SPACING / 2;

            const cy =
                P_Y +
                y * SPACING +
                SPACING / 2;

            const raster =
                (
                    y * cols +
                    x
                ) / total;

            const appear =
                1.0 +
                raster * 5.4;

            const appear2 =
                Math.min(
                    appear + 0.10,
                    7.8
                );

            let t1 =
                appear /
                DURATION;

            let t2 =
                appear2 /
                DURATION;

            t1 =
                Math.max(
                    0,
                    Math.min(
                        0.82,
                        t1
                    )
                );

            t2 =
                Math.max(
                    t1,
                    Math.min(
                        0.82,
                        t2
                    )
                );

            const keyTimes =
                [
                    "0",
                    t1.toFixed(6),
                    t2.toFixed(6),
                    "0.82",
                    "1"
                ].join(";");

            const largerRadius =
                radius + 0.35;

            circles.push(`
<circle
    cx="${cx.toFixed(2)}"
    cy="${cy.toFixed(2)}"
    r="${radius.toFixed(2)}"
    fill="#78ff9c"
    fill-opacity="${opacity.toFixed(3)}"
    opacity="0">

    <animate
        attributeName="opacity"
        values="0;0;1;1;0"
        keyTimes="${keyTimes}"
        dur="${DURATION}s"
        repeatCount="indefinite"/>

    <animate
        attributeName="r"
        values="${radius.toFixed(2)};${radius.toFixed(2)};${largerRadius.toFixed(2)};${radius.toFixed(2)};${radius.toFixed(2)}"
        keyTimes="${keyTimes}"
        dur="${DURATION}s"
        repeatCount="indefinite"/>

</circle>
`);
        }
    }

    return circles.join("");
}


/* ============================================================
   GENERATE SVG
============================================================ */

function generateSVG(
    image,
    mask
) {

    const D_W = 1400;
    const D_H = 600;

    const P_W = 460;
    const P_H = 480;

    const P_X = 850;
    const P_Y = 60;

    const OUTER_W =
        D_W - 30;

    const OUTER_H =
        D_H - 30;

    const INNER_W =
        D_W - 44;

    const INNER_H =
        D_H - 44;

    const FRAME_X =
        P_X - 30;

    const FRAME_Y =
        P_Y - 2;

    const FRAME_W =
        P_W + 60;

    const FRAME_H =
        P_H + 4;

    const INNER_FRAME_X =
        P_X - 20;

    const INNER_FRAME_Y =
        P_Y + 8;

    const INNER_FRAME_W =
        P_W + 40;

    const INNER_FRAME_H =
        P_H - 16;

    const SCAN_END_X =
        P_X + P_W;

    const P_END_X =
        P_X + P_W;

    const P_END_Y =
        P_Y + P_H;

    const STATUS_X =
        P_X + P_W + 5;

    const STATUS_Y =
        P_Y + 32;

    const COMPLETE_DOT_X =
        P_X + P_W - 8;

    const COMPLETE_DOT_Y =
        P_Y + 22;

    const COMPLETE_TEXT_X =
        P_X + P_W - 18;

    const COMPLETE_TEXT_Y =
        P_Y + 27;

    const CORNER1_X =
        P_X - 35;

    const CORNER1_Y1 =
        P_Y + 30;

    const CORNER1_Y2 =

    const CORNER1_X2 =

    const CORNER2_Y1 =
        P_Y + P_H - 30;

    const CORNER2_Y2 =

    const CORNER2_X2 =
        P_X + P_W - 10;


    const circles =
        generateParticles(

    /*

    const skillWidths = [
        105,
        135,
        145,
        75,
        145

        430,

    PROFILE.skills.forEach(

            const start =

                index * 0.04;

            const end =

    <stop
        offset="55%"

        "Courier New",

        "Courier New",

<!-- BACKGROUND -->

${circles}

    <circle

        <animate
            attributeName="opacity"

    </text>

</g>

</svg>`;
}
